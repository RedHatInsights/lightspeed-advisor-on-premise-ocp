# Input for rpm-lockfile-prototype -> rpms.lock.yaml (regenerate via
# scripts/update_rpm_lockfile.sh).
#
# The Dockerfile is the source of truth for RPMs. Add direct RPM requirements to
# its RUN microdnf/dnf/yum install command, then regenerate the lockfile; the
# resolver will include transitive RPM dependencies (for example libpq for
# python3.12-psycopg2) automatically.
#
# The repos come from the Dockerfile base image's own /etc/yum.repos.d/ubi.repo
# (extracted by the helper script), so regenerating and prefetching the current
# RPM set needs no Red Hat entitlement for these public UBI repositories.
contentOrigin:
  repofiles: ["./ubi.repo"]
context:
  # Keep base-image resolution in sync with the Dockerfile's FROM line. The
  # tool inspects RPMs already installed in that image while resolving the
  # dependency graph; resolving against a different image can lock package
  # versions that microdnf cannot use in the hermetic build.
  containerfile: Dockerfile
packagesFromContainerfile: Dockerfile
arches:
  - x86_64
