apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: insights-on-prem-proxy
  namespace: insights-on-prem
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # --- Namespace (already exists on the hub; created here for spokes) ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-namespace
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: insights-on-prem
                  labels:
                    name: insights-on-prem

    # --- HAProxy ConfigMap ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-proxy-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-on-prem-proxy-config
                  namespace: insights-on-prem
                data:
                  haproxy.cfg: |
                    global
                        log stdout local0

                    defaults
                        mode http
                        log global
                        option httplog
                        timeout connect 5s
                        timeout client 30s
                        timeout server 30s

                    frontend proxy
                        bind *:8443 ssl crt /tmp/server.pem ssl-min-ver TLSv1.2
                        default_backend hub

                    backend hub
                        server hub {{hub (lookup "route.openshift.io/v1" "Route" "insights-on-prem" "insights-on-prem").spec.host hub}}:443 ssl crt /tmp/client.pem ca-file /certs/hub-ca/ca-bundle.crt verify required verifyhost {{hub (lookup "route.openshift.io/v1" "Route" "insights-on-prem" "insights-on-prem").spec.host hub}} sni str({{hub (lookup "route.openshift.io/v1" "Route" "insights-on-prem" "insights-on-prem").spec.host hub}}) ssl-min-ver TLSv1.2

    # --- proxy Service ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-proxy-service
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: insights-on-prem-proxy
                  namespace: insights-on-prem
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: insights-on-prem-proxy-tls
                spec:
                  selector:
                    app: insights-on-prem-proxy
                  ports:
                    - port: 8443
                      targetPort: 8443
                      protocol: TCP
                      name: https

    # --- Hub server CA (HAProxy verifies hub's server cert with this) ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-proxy-hub-ca
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-on-prem-proxy-hub-ca
                  namespace: insights-on-prem
                data:
                  ca-bundle.crt: |
                    {{hub fromConfigMap "insights-on-prem" "insights-on-prem-hub-ca" "ca-bundle.crt" | autoindent hub}}

    # --- NetworkPolicy: only openshift-insights namespace can reach the proxy ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-proxy-netpol
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: insights-on-prem-proxy
                  namespace: insights-on-prem
                spec:
                  podSelector:
                    matchLabels:
                      app: insights-on-prem-proxy
                  policyTypes:
                    - Ingress
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: openshift-insights
                      ports:
                        - protocol: TCP
                          port: 8443

    # --- Insights Operator configuration ---
    # Reads the spoke's service-ca and passes it directly to Insights Operator
    # via dataReporting.CACert so IO trusts HAProxy's serving cert.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-proxy-operator-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- $serviceCA := fromConfigMap "openshift-insights" "service-ca-bundle" "service-ca.crt" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-config
                  namespace: openshift-insights
                data:
                  config.yaml: |
                    dataReporting:
                      uploadEndpoint: https://insights-on-prem-proxy.insights-on-prem.svc:8443/api/ingress/v1/upload
                      downloadEndpoint: https://insights-on-prem-proxy.insights-on-prem.svc:8443/api/v2/cluster/%s/reports
                      downloadEndpointTechPreview: https://insights-on-prem-proxy.insights-on-prem.svc:8443/api/v2/cluster/%s/request/%s/report
                      processingStatusEndpoint: https://insights-on-prem-proxy.insights-on-prem.svc:8443/api/v2/cluster/%s/request/%s/status
                      interval: 0h1m0s
                      CACert: |
                        {{ $serviceCA | autoindent }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: insights-on-prem-proxy
  namespace: insights-on-prem
placementRef:
  name: all-managed-clusters
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: insights-on-prem-proxy
    apiGroup: policy.open-cluster-management.io
    kind: Policy
